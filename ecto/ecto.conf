# tmux-style bindings. Symlinked to ~/.config/ecto/ecto.conf.
set -g prefix C-s
bind C-s send-prefix

set -g base-index 1
set -g renumber-windows on
set -g mouse on
setw -g mode-keys vi
set -g set-clipboard on

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r S-H resize-pane -L 5
bind -r S-J resize-pane -D 5
bind -r S-K resize-pane -U 5
bind -r S-L resize-pane -R 5

bind d split-window -h -c '#{pane_current_path}'
bind s split-window -v -c '#{pane_current_path}'
bind z resize-pane -Z
bind i join-pane -s !
bind - detach-client
bind x kill-pane

bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9

bind g source-file ~/.config/ecto/ecto.conf

# Tab cycling (native macOS also handles these in its Window menu).
bind -n C-Tab next-window
bind -n C-BTab previous-window

# tmux's default management keys, also available on older Ecto daemons.
bind '{' swap-pane -U
bind '}' swap-pane -D
bind '!' break-pane
bind '$' command-prompt -I '#S' -p 'Rename session' { rename-session -- '%%' }
bind ',' command-prompt -I '#W' -p 'Rename tab' { rename-window -- '%%' }
bind ':' command-prompt
# Ecto's session chooser replaces the sessionx plugin binding.
bind o choose-tree -Zs

# Same clear-screen behavior as ~/.tmux.conf.
is_program="ps -o comm= -t '#{pane_tty}' | grep -vE '^-?(fish|bash|zsh|sh|ps|grep|awk|sed|cut|sort|uniq|head|cat|echo|printf)$' | grep -q ."
bind -n M-k if-shell "$is_program" 'send-keys -R; clear-history' 'send-keys C-l'
bind e run-shell '~/.config/scripts/ecto-edit #{pane_id}'

# Clipboard pipelines use the local CLI and inherit this daemon's ECTO_SOCKET.
# -C leaves clipboard delivery to the transformed result, avoiding a second write.
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe -C 'python3 -c "import sys, textwrap; sys.stdout.write(textwrap.dedent(sys.stdin.read()))" | ~/code/ecto/target/debug/ecto --no-start load-buffer -w -'
bind -T copy-mode-vi M-y send-keys -X copy-selection
bind -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Y send-keys -X select-line \; send-keys -X copy-pipe -C 'tr -d "\r\n" | ~/code/ecto/target/debug/ecto --no-start load-buffer -w -' \; display-message 'copied line'
bind -T copy-mode-vi MouseDown3Pane send-keys -X copy-selection-and-cancel
bind -n MouseDown3Pane run-shell -b 'pbpaste | ~/code/ecto/target/debug/ecto --no-start load-buffer -w - && ~/code/ecto/target/debug/ecto --no-start paste-buffer -t #{pane_id}'
unbind -T copy-mode-vi MouseDragEnd1Pane

# CSI-u shifted-letter aliases from ~/.tmux.conf.
bind -T copy-mode-vi S-A send-keys -X append-selection-and-cancel
bind -T copy-mode-vi S-B send-keys -X previous-space
bind -T copy-mode-vi S-D send-keys -X copy-pipe-end-of-line-and-cancel
bind -T copy-mode-vi S-E send-keys -X next-space-end
bind -T copy-mode-vi S-F command-prompt -1 -p '(jump backward)' { send-keys -X jump-backward '%%' }
bind -T copy-mode-vi S-G send-keys -X history-bottom
bind -T copy-mode-vi S-H send-keys -X top-line
bind -T copy-mode-vi S-J send-keys -X scroll-down
bind -T copy-mode-vi S-K send-keys -X scroll-up
bind -T copy-mode-vi S-L send-keys -X bottom-line
bind -T copy-mode-vi S-M send-keys -X middle-line
bind -T copy-mode-vi S-N send-keys -X search-reverse
bind -T copy-mode-vi S-P send-keys -X toggle-position
bind -T copy-mode-vi S-T command-prompt -1 -p '(jump to backward)' { send-keys -X jump-to-backward '%%' }
bind -T copy-mode-vi S-V send-keys -X select-line
bind -T copy-mode-vi S-W send-keys -X next-space
bind -T copy-mode-vi S-X send-keys -X set-mark
bind -T copy-mode-vi S-Y send-keys -X select-line \; send-keys -X copy-pipe -C 'tr -d "\r\n" | ~/code/ecto/target/debug/ecto --no-start load-buffer -w -' \; display-message 'copied line'
unbind -q -T root C-l
unbind -q -T copy-mode-vi C-l
