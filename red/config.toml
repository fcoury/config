theme = "red.json"
# markdown_images = "kitty"
# relative_line_numbers = true

[keys.normal]
";" = { EnterMode = "Command" }
j = "MoveScreenLineDown"
k = "MoveScreenLineUp"

# [statusline]
# left = ["mode", "filename"]
# right = ["position", "syntax", "git_branch"]

[statusline.icons]
style = "nerd_font"
color = true

[copilot]
enabled = true

[lsp.servers.rust]
command = "/Users/fcoury/.cargo/bin/rust-glancer"
args = ["lsp"]
language_id = "rust"
file_extensions = ["rs"]
root_markers = ["Cargo.toml", ".git"]

[lsp.servers.rust.initialization_options.diagnostics]
onStartup = false
onSave = true
command = "check"
